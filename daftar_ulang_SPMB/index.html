<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Surat Mutasi - SDN 006</title>
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Mencegah scrollbar ganda */
            background-color: #ffffff;
        }

        /* Wrapper Sekuat Kode 3 */
        #app-container {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 999999;
            display: flex;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Ganti URL di bawah dengan URL /exec milik Anda -->
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxe5yFMwLKq8IdApIU04muXWdyBDjz_J6I7isT6DdPeaohLQ92AaV08IVcf41mIfhEK0A/exec" 
            allow="geolocation; microphone; camera; midi; encrypted-media; clipboard-read; clipboard-write"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
