<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Surat Mutasi - SDN 006</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%; width: 100%;
            overflow: hidden; 
            background-color: transparent; /* Kendali latar sepenuhnya ada di GAS */
        }

        #app-container {
            position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            width: 100%; height: 100%;
            border: none; z-index: 999999;
        }

        iframe {
            width: 100%; height: 100%;
            border: none; display: block;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Ganti URL_GAS dengan URL /exec -->
        <iframe 
            src="https://script.google.com/macros/s/AKfycbzwCjKV8I2-74bt8uSV2QrfjGS0x85tyONiPBKj8Pv01rrfWxOt9Lsmm9-IqUjcCvqmaA/exec" 
            allow="geolocation; microphone; camera; midi; encrypted-media; clipboard-read; clipboard-write"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
