<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner Presensi - SDN 006</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #0f172a; /* Slate 900 - Gelap hemat baterai */
      color: white; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    /* Styling Kamera */
    #qr-reader { 
      width: 100%; 
      max-width: 450px; 
      margin: 0 auto; 
      border-radius: 1.5rem; 
      overflow: hidden; 
      border: 4px solid #3b82f6; 
      box-shadow: 0 0 25px rgba(59,130,246,0.3); 
      background: black; 
    }
    #qr-reader video { object-fit: cover; }
    #qr-reader__dashboard_section_csr span { color: white !important; }
  </style>
</head>
<body class="flex flex-col h-[100dvh] justify-between overflow-hidden">

  <!-- Header -->
  <header class="p-4 bg-slate-800 shadow-lg text-center z-10">
    <h1 class="text-xl font-bold text-blue-400 tracking-wider">
      <i class="fa-solid fa-qrcode mr-2"></i> SCAN QR
    </h1>
    <p class="text-xs text-slate-300 mt-1" id="infoPetugas">Memuat info petugas...</p>
  </header>

  <!-- Scanner Area -->
  <main class="flex-grow flex flex-col justify-center p-4 relative">
    <!-- Overlay Aktifkan Scanner (Untuk Bypass Audio Autoplay Browser) -->
    <div id="start-overlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-900/95 m-4 border border-slate-700 rounded-[1.5rem]">
       <!-- Isi dari overlay ini dikendalikan oleh JS Fetch Cache -->
       <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
       <p class="text-slate-300 font-bold">Menyiapkan Scanner...</p>
    </div>

    <div id="qr-reader"></div>
    <div class="mt-6 text-center h-12 flex items-center justify-center">
      <p id="scan-status" class="text-slate-400 bg-slate-800 px-5 py-2.5 rounded-full inline-block text-sm shadow border border-slate-700 transition-colors">
        <i class="fa-solid fa-info-circle mr-2"></i> Menunggu aktivasi...
      </p>
    </div>
  </main>

  <!-- Footer / Controls -->
  <footer class="px-6 pt-6 pb-12 bg-slate-800 text-center z-10 shadow-[0_-4px_10px_rgba(0,0,0,0.2)]">
    <button onclick="closeScanner()" class="w-full max-w-sm mx-auto bg-red-500/10 hover:bg-red-500/20 border border-red-500/50 text-red-400 font-bold py-3.5 px-8 rounded-2xl transition-all flex items-center justify-center shadow-lg">
      <i class="fa-solid fa-xmark mr-2 text-xl"></i> Tutup Scanner
    </button>
  </footer>

  <script>
    // --- 1. AMBIL PARAMETER DARI URL ---
    const urlParams = new URLSearchParams(window.location.search);
    const gasUrl = urlParams.get('gas_url');
    const akunId = urlParams.get('akun_id');
    const namaPetugas = urlParams.get('nama_petugas') || 'Petugas Tidak Diketahui';
    const tipeScan = urlParams.get('tipe_scan');

    let html5QrCode;
    let isProcessing = false;
    let localCache = null; // BUKU SAKU DIGITAL UNTUK SCANNER
    
    // Inisialisasi Web Audio API (Mesin Suara Bawaan Browser)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSuccessBeep() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
      gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function playErrorBeep() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Jika diakses tanpa parameter (misal buka langsung tidak dari web utama), tolak akses
      if (!gasUrl) {
        Swal.fire('Akses Ditolak', 'Buka scanner ini dari dalam aplikasi presensi utama.', 'error');
        document.getElementById('scan-status').innerHTML = '<span class="text-red-500 font-bold"><i class="fa-solid fa-ban mr-1"></i> Akses Ditolak</span>';
        document.getElementById('start-overlay').style.display = 'none'; // Sembunyikan overlay
        return;
      }

      document.getElementById('infoPetugas').innerHTML = `<i class="fa-solid fa-user-tag mr-1"></i> ${namaPetugas}`;
      fetchScannerCache();
    });
    
    // --- 1.2 FUNGSI DOWNLOAD CACHE (Buku Saku) ---
    function fetchScannerCache() {
      const btnOverlay = document.getElementById('start-overlay');
      btnOverlay.innerHTML = `<div class="text-center p-6"><i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i><p class="text-slate-200 font-bold text-lg">Mempersiapkan Data...</p><p class="text-xs text-slate-400 mt-2">harap tunggu...</p></div>`;

      fetch(gasUrl, { method: 'POST', body: JSON.stringify({ action: 'getScannerCache', akunId: akunId, tipeScan: tipeScan }) })
      .then(r => r.json())
      .then(res => {
         if (res.status === 'success') {
            localCache = res.data;
            checkGpsAndInit(btnOverlay);
         } else {
            btnOverlay.innerHTML = `<p class="text-red-400 font-bold text-center px-4"><i class="fa-solid fa-triangle-exclamation mr-1 text-2xl mb-2 block"></i> ${res.message}</p>`;
         }
      })
      .catch(err => {
         btnOverlay.innerHTML = `<p class="text-red-400 font-bold text-center px-4"><i class="fa-solid fa-wifi mr-1 text-2xl mb-2 block"></i> Gagal terhubung ke server.</p>`;
      });
    }

    // --- 1.3 LOGIKA VERIFIKASI GPS (GEOFENCING) ---
    function checkGpsAndInit(btnOverlay) {
       if (localCache.gps && String(localCache.gps.status).trim().toLowerCase() === 'aktif') {
          btnOverlay.innerHTML = `<div class="text-center p-6"><i class="fa-solid fa-location-dot animate-bounce text-4xl text-green-500 mb-4"></i><p class="text-slate-200 font-bold text-lg">Memeriksa Lokasi...</p><p class="text-xs text-slate-400 mt-2">Pastikan GPS aktif & beri izin lokasi ke browser.</p></div>`;
          
          if (navigator.geolocation) {
             navigator.geolocation.getCurrentPosition(
                (position) => {
                   const userLat = position.coords.latitude;
                   const userLng = position.coords.longitude;
                   const targetLat = localCache.gps.lat;
                   const targetLng = localCache.gps.lng;
                   const radiusMax = localCache.gps.radius;

                   const distance = getDistanceFromLatLonInM(userLat, userLng, targetLat, targetLng);
                   
                   if (distance <= radiusMax) {
                      initScanner();
                   } else {
                      btnOverlay.innerHTML = `
                        <div class="text-center p-6">
                          <i class="fa-solid fa-ban text-4xl text-red-500 mb-4"></i>
                          <p class="text-red-400 font-bold text-lg">Di Luar Area Presensi</p>
                          <p class="text-xs text-slate-300 mt-2">Jarak Anda: <strong>${Math.round(distance)} meter</strong> dari titik sekolah.</p>
                          <p class="text-[10px] text-slate-500 mt-1">Maksimal toleransi: ${radiusMax} meter.</p>
                          <button onclick="checkGpsAndInit(document.getElementById('start-overlay'))" class="mt-6 border border-slate-600 px-4 py-2 rounded-xl text-xs hover:bg-slate-800 transition">Cek Ulang Lokasi</button>
                        </div>
                      `;
                   }
                },
                (error) => {
                   btnOverlay.innerHTML = `
                     <div class="text-center p-6">
                       <i class="fa-solid fa-location-crosshairs text-4xl text-orange-500 mb-4"></i>
                       <p class="text-orange-400 font-bold text-lg">Gagal Akses GPS</p>
                       <p class="text-xs text-slate-300 mt-2">Pastikan fitur Lokasi / GPS di HP Anda menyala dan izinkan browser ini untuk mengaksesnya.</p>
                       <button onclick="checkGpsAndInit(document.getElementById('start-overlay'))" class="mt-6 border border-slate-600 px-4 py-2 rounded-xl text-xs hover:bg-slate-800 transition">Coba Lagi</button>
                     </div>
                   `;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
             );
          } else {
             btnOverlay.innerHTML = `<p class="text-red-400 font-bold text-center px-4"><i class="fa-solid fa-triangle-exclamation mr-1 text-2xl mb-2 block"></i> Browser Anda tidak mendukung GPS Geolocation.</p>`;
          }
       } else {
          // Jika fitur GPS di pengaturan dinonaktifkan Admin
          initScanner();
       }
    }

    function renderStartButton(btnOverlay, extraText) {
       btnOverlay.innerHTML = `
          <button onclick="initScanner()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-full shadow-[0_0_25px_rgba(37,99,235,0.4)] transition-all transform hover:scale-105">
            <i class="fa-solid fa-power-off mr-2 text-lg"></i> Aktifkan Kamera
          </button>
          <p class="text-xs text-slate-400 mt-5 font-medium"><i class="fa-solid fa-check-circle mr-1 text-green-400"></i> ${extraText}</p>
       `;
    }

    // RUMUS HAVERSINE UNTUK MENGHITUNG JARAK KORDINAT (Dalam Meter)
    function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Radius rata-rata bumi dalam meter
      const dLat = deg2rad(lat2-lat1);
      const dLon = deg2rad(lon2-lon1); 
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
        Math.sin(dLon/2) * Math.sin(dLon/2); 
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      return R * c; // Hasil akhir dalam satuan meter
    }
    function deg2rad(deg) { return deg * (Math.PI/180); }

    // --- 1.5 FUNGSI PEMBUKA KUNCI AUDIO (Bypass Autoplay) ---
    function initScanner() {
      // Buka gembok Web Audio API
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // Sembunyikan overlay & ubah status
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('scan-status').innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mempersiapkan kamera...';
      document.getElementById('scan-status').classList.add('animate-pulse', 'text-slate-200');
      
      startScanner();
    }

    // --- 2. INISIALISASI KAMERA ---
    function startScanner() {
      const statusEl = document.getElementById('scan-status');
      html5QrCode = new Html5Qrcode("qr-reader");

      const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };

      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .then(() => {
          statusEl.innerHTML = '<span class="text-green-400 font-medium"><i class="fa-solid fa-camera mr-1"></i> Kamera siap. Arahkan ke QR Code.</span>';
          statusEl.classList.remove('animate-pulse');
        })
        .catch((err) => {
          console.error("Camera Error:", err);
          statusEl.innerHTML = `<span class="text-red-400 font-bold">Gagal mengakses kamera.</span><br><small class="text-slate-400 mt-1 block">Pastikan izin kamera diberikan pada browser.</small>`;
          statusEl.classList.remove('animate-pulse');
        });
    }

    // --- 3. LOGIKA SAAT QR TERBACA ---
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      // Jeda scanner sementara agar tidak scan berulang kali (spam)
      if (html5QrCode.getState() === Html5QrcodeScannerState.SCANNING) {
        html5QrCode.pause();
      }

      const decodedClean = String(decodedText).replace(/'/g, '').trim();

      // --- MODE INSTAN: CEK DENGAN BUKU SAKU DIGITAL ---
      if (localCache) {
         if (localCache.tipeScan) {
            // PEGAWAI SCAN STATIS
            if (decodedClean !== localCache.expectedQr) {
               playErrorBeep(); Swal.fire({toast:true, position:'top', icon:'error', title:'QR Salah', text:'Pastikan scan QR Resmi Sekolah', showConfirmButton:false, timer:1500}); resumeScanner(1500); return;
            }
            if (localCache.tipeScan === 'MASUK' && localCache.sudahMasuk) {
               playErrorBeep(); Swal.fire({toast:true, position:'top', icon:'warning', title:'Sudah Absen', text:'Anda sudah absen masuk hari ini.', showConfirmButton:false, timer:1500}); resumeScanner(1500); return;
            }
            if (localCache.tipeScan === 'PULANG' && localCache.sudahPulang) {
               playErrorBeep(); Swal.fire({toast:true, position:'top', icon:'warning', title:'Sudah Absen', text:'Anda sudah absen pulang hari ini.', showConfirmButton:false, timer:1500}); resumeScanner(1500); return;
            }
         } else if (localCache.role === 'siswa') {
            // SISWA SCAN MANDIRI
            if (decodedClean !== localCache.expectedToken) {
               playErrorBeep(); Swal.fire({toast:true, position:'top', icon:'error', title:'QR Kadaluarsa', text:'QR di layar sudah tidak valid.', showConfirmButton:false, timer:1500}); resumeScanner(1500); return;
            }
            if (localCache.sudahScan) {
               playErrorBeep(); Swal.fire({toast:true, position:'top', icon:'warning', title:'Sudah Absen', text:'Anda sudah tercatat hadir hari ini.', showConfirmButton:false, timer:1500}); resumeScanner(1500); return;
            }

            // Valid! Update lokal, bunyi sukses, lanjut cepat (Tembak Gaib)!
            localCache.sudahScan = true;
            playSuccessBeep();
            Swal.fire({toast:true, position:'top', icon:'success', title:'Hadir', text:'Kehadiran mandiri tercatat.', showConfirmButton:false, timer:1500});
            
            // Tembak server gaib secara background
            fireBackgroundAPI(decodedClean, 'recordAttendance');
            resumeScanner(1500);
            return;
         } else {
            // GURU/ADMIN SCAN KARTU SISWA (ESTAFET MASSAL)
            const student = localCache.students[decodedClean];
            if (!student) {
               playErrorBeep(); Swal.fire({toast:true, position:'top', icon:'error', title:'Tidak Dikenal', text:'Siswa tidak terdaftar di sistem.', showConfirmButton:false, timer:1500}); resumeScanner(1500); return;
            }
            if (localCache.scannedToday[student.id]) {
               playErrorBeep(); Swal.fire({toast:true, position:'top', icon:'warning', title:'Sudah Absen', text:`${student.nama} sudah diabsen.`, showConfirmButton:false, timer:1500}); resumeScanner(1500); return;
            }

            // Valid! Update lokal, bunyi sukses, lanjut cepat!
            localCache.scannedToday[student.id] = true;
            playSuccessBeep();
            Swal.fire({toast:true, position:'top', icon:'success', title:'Hadir', text:`${student.nama} (${student.kelas})`, showConfirmButton:false, timer:800});
            
            // Tembak server gaib
            fireBackgroundAPI(decodedClean, 'recordAttendance');
            resumeScanner(800);
            return;
         }
      }

      // --- FALLBACK: JIKA BUKAN GURU (ATAU DATA PERLU KONFIRMASI JAM 서버) ---

      const statusEl = document.getElementById('scan-status');
      statusEl.innerHTML = `<span class="text-blue-400 font-bold"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Mencatat...</span>`;
      playSuccessBeep();

      let actionName = tipeScan ? 'recordAttendancePegawai' : 'recordAttendance';
      let payloadObj = { action: actionName, qrCode: decodedText, akunId: akunId };
      if (tipeScan) payloadObj.tipeScan = tipeScan;

      fetch(gasUrl, { method: 'POST', body: JSON.stringify(payloadObj) })
      .then(response => response.json())
      .then(data => {
        if(data.status === 'success' && localCache) {
           if(tipeScan === 'MASUK') localCache.sudahMasuk = true;
           if(tipeScan === 'PULANG') localCache.sudahPulang = true;
           if(localCache.role === 'siswa') localCache.sudahScan = true;
        }
        Swal.fire({ toast: true, position: 'top', icon: data.status === 'success' ? 'success' : 'error', title: data.status === 'success' ? 'Berhasil' : 'Gagal', text: data.message, showConfirmButton: false, timer: 1500 });
      })
      .catch(error => {
        Swal.fire({ toast: true, position: 'top', icon: 'error', title: 'Error Jaringan', text: 'Gagal menghubungi server.', showConfirmButton: false, timer: 1500 });
      })
      .finally(() => resumeScanner(1500));
    }

    function fireBackgroundAPI(qrCodeText, actionName) {
      let payloadObj = { action: actionName, qrCode: qrCodeText, akunId: akunId };
      fetch(gasUrl, { method: 'POST', body: JSON.stringify(payloadObj) }).catch(e => console.warn(e));
    }

    function resumeScanner(ms) {
      setTimeout(() => {
        isProcessing = false;
        if (html5QrCode && html5QrCode.getState() === Html5QrcodeScannerState.PAUSED) html5QrCode.resume();
        document.getElementById('scan-status').innerHTML = '<span class="text-green-400 font-medium"><i class="fa-solid fa-camera mr-1"></i> Siap memindai berikutnya...</span>';
      }, ms);
    }

    // --- 4. TUTUP TAB ---
    function closeScanner() {
      // Coba matikan kamera dulu sebelum tutup tab
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => window.close()).catch(() => window.close());
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
