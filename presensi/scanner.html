<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner Presensi - SDN 006</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #0f172a; /* Slate 900 - Gelap hemat baterai */
      color: white; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    /* Styling Kamera */
    #qr-reader { 
      width: 100%; 
      max-width: 450px; 
      margin: 0 auto; 
      border-radius: 1.5rem; 
      overflow: hidden; 
      border: 4px solid #3b82f6; 
      box-shadow: 0 0 25px rgba(59,130,246,0.3); 
      background: black; 
    }
    #qr-reader video { object-fit: cover; }
    #qr-reader__dashboard_section_csr span { color: white !important; }
  </style>
</head>
<body class="flex flex-col h-screen justify-between overflow-hidden">

  <!-- Header -->
  <header class="p-4 bg-slate-800 shadow-lg text-center z-10">
    <h1 class="text-xl font-bold text-blue-400 tracking-wider">
      <i class="fa-solid fa-qrcode mr-2"></i> SCAN ESTAFET
    </h1>
    <p class="text-xs text-slate-300 mt-1" id="infoPetugas">Memuat info petugas...</p>
  </header>

  <!-- Scanner Area -->
  <main class="flex-grow flex flex-col justify-center p-4 relative">
    <div id="qr-reader"></div>
    <div class="mt-6 text-center h-12 flex items-center justify-center">
      <p id="scan-status" class="text-slate-200 bg-slate-800 px-5 py-2.5 rounded-full inline-block text-sm shadow animate-pulse border border-slate-700">
        <i class="fa-solid fa-spinner fa-spin mr-2"></i> Mempersiapkan kamera...
      </p>
    </div>
  </main>

  <!-- Footer / Controls -->
  <footer class="p-6 bg-slate-800 text-center z-10 shadow-[0_-4px_10px_rgba(0,0,0,0.2)]">
    <button onclick="closeScanner()" class="w-full max-w-sm mx-auto bg-red-500/10 hover:bg-red-500/20 border border-red-500/50 text-red-400 font-bold py-3.5 px-8 rounded-2xl transition-all flex items-center justify-center shadow-lg">
      <i class="fa-solid fa-xmark mr-2 text-xl"></i> Tutup Scanner
    </button>
  </footer>

  <!-- Audio Beep -->
  <audio id="beep-sound" src="https://www.soundjay.com/buttons/sounds/beep-07a.mp3" preload="auto"></audio>

  <script>
    // --- 1. AMBIL PARAMETER DARI URL ---
    const urlParams = new URLSearchParams(window.location.search);
    const gasUrl = urlParams.get('gas_url');
    const scannedBy = urlParams.get('scanned_by') || 'Petugas Tidak Diketahui';

    let html5QrCode;
    let isProcessing = false;

    document.addEventListener("DOMContentLoaded", () => {
      // Jika diakses tanpa parameter (misal buka langsung tidak dari web utama), tolak akses
      if (!gasUrl) {
        Swal.fire('Akses Ditolak', 'Buka scanner ini dari dalam aplikasi presensi utama.', 'error');
        document.getElementById('scan-status').innerHTML = '<span class="text-red-500 font-bold"><i class="fa-solid fa-ban mr-1"></i> Akses Ditolak</span>';
        return;
      }

      document.getElementById('infoPetugas').innerHTML = `<i class="fa-solid fa-user-tag mr-1"></i> ${scannedBy}`;
      startScanner();
    });

    // --- 2. INISIALISASI KAMERA ---
    function startScanner() {
      const statusEl = document.getElementById('scan-status');
      html5QrCode = new Html5Qrcode("qr-reader");

      const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };

      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .then(() => {
          statusEl.innerHTML = '<span class="text-green-400 font-medium"><i class="fa-solid fa-camera mr-1"></i> Kamera siap. Arahkan ke QR Code.</span>';
          statusEl.classList.remove('animate-pulse');
        })
        .catch((err) => {
          console.error("Camera Error:", err);
          statusEl.innerHTML = `<span class="text-red-400 font-bold">Gagal mengakses kamera.</span><br><small class="text-slate-400 mt-1 block">Pastikan izin kamera diberikan pada browser.</small>`;
          statusEl.classList.remove('animate-pulse');
        });
    }

    // --- 3. LOGIKA SAAT QR TERBACA ---
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      // Jeda scanner sementara agar tidak scan berulang kali (spam)
      if (html5QrCode.getState() === Html5QrcodeScannerState.SCANNING) {
        html5QrCode.pause();
      }

      // Mainkan suara beep
      document.getElementById('beep-sound').play().catch(e => console.log("Audio autoplay diblokir", e));

      const statusEl = document.getElementById('scan-status');
      statusEl.innerHTML = `<span class="text-blue-400 font-bold"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Mencatat: ${decodedText}...</span>`;

      // Kirim Data ke API GAS via Fetch Background
      fetch(gasUrl, {
        method: 'POST',
        body: JSON.stringify({ action: 'recordAttendance', qrCode: decodedText, scannedBy: scannedBy })
      })
      .then(response => response.json())
      .then(data => {
        // Munculkan notifikasi Toast ringan (tidak menutupi layar)
        Swal.fire({ toast: true, position: 'top', icon: data.status === 'success' ? 'success' : 'error', title: data.status === 'success' ? 'Berhasil' : 'Gagal', text: data.message, showConfirmButton: false, timer: 1500 });
      })
      .catch(error => {
        Swal.fire({ toast: true, position: 'top', icon: 'error', title: 'Error Jaringan', text: 'Gagal menghubungi server.', showConfirmButton: false, timer: 1500 });
      })
      .finally(() => {
        // ESTAFET MODE: Lanjutkan kamera otomatis setelah 1.5 detik
        setTimeout(() => {
          isProcessing = false;
          if (html5QrCode.getState() === Html5QrcodeScannerState.PAUSED) html5QrCode.resume();
          statusEl.innerHTML = '<span class="text-green-400 font-medium"><i class="fa-solid fa-camera mr-1"></i> Siap memindai berikutnya...</span>';
        }, 1500);
      });
    }

    // --- 4. TUTUP TAB ---
    function closeScanner() {
      // Coba matikan kamera dulu sebelum tutup tab
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => window.close()).catch(() => window.close());
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
